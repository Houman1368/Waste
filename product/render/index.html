<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#F7F9FA;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'hero';
const W = +(q.get('w') || 1600), H = +(q.get('h') || 1200);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(view === 'cutaway' ? 0xEEF2F4 : 0xF7F9FA);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// دیوار پشت
const wall = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0xF2F5F6, roughness: 0.95 }));
wall.position.set(0, 300, -0.5); wall.receiveShadow = true;
if (view !== 'side') scene.add(wall);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(500, 900, 900); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -600, right: 600, top: 900, bottom: -400, near: 10, far: 3000 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdde4e8, 0.6));

const C = {
  housing: { color: 0xffffff, roughness: 0.35 },
  guard: { color: 0xC9D1D6, roughness: 0.4, metalness: 0.2 },
  led_front: { color: 0x4A42C0, emissive: 0x6A61E0, emissiveIntensity: 1.0, roughness: 0.2 },
  led_inner: { color: 0x4A42C0, emissive: 0x6A61E0, emissiveIntensity: 1.0 },
  status_led: { color: 0x1D9E75, emissive: 0x1D9E75, emissiveIntensity: 1.5 },
  cartridge: { color: 0x5F5E5A, roughness: 0.55 },
  release_button: { color: 0x0F6E56, roughness: 0.4 },
  label: { color: 0xFAEEDA, roughness: 0.6 },
  film: { color: 0xF6E2B4, roughness: 0.25 },
  supply_roll: { color: 0xF2D79E, roughness: 0.3 },
  takeup_roll: { color: 0xF2D79E, roughness: 0.3 },
  cores: { color: 0xBA7517, roughness: 0.6 },
  knob: { color: 0x0F6E56, roughness: 0.4 },
  drive_unit: { color: 0x8C9196, roughness: 0.3, metalness: 0.6 },
  pcb: { color: 0x1A7350, roughness: 0.5 },
  flies: { color: 0x1F2A30, roughness: 0.4 },
};

const VIEWS = {
  hero:    { cam: [560, 520, 1250], target: [10, 280, 40], fov: 30, hide: ['drive_unit', 'pcb', 'supply_roll', 'takeup_roll', 'cores'] },
  front:   { cam: [0, 290, 1500], target: [0, 290, 40], fov: 25, hide: ['drive_unit', 'pcb', 'supply_roll', 'takeup_roll', 'cores'] },
  cutaway: { cam: [600, 520, 1050], target: [0, 280, 30], fov: 33, ghost: ['housing', 'guard', 'cartridge', 'label', 'release_button'], hide: ['knob'] },
  service: { cam: [700, 300, 1500], target: [0, 160, 40], fov: 33, hide: ['drive_unit', 'pcb', 'film', 'flies', 'supply_roll', 'takeup_roll', 'cores'], move: { y: -260, parts: ['cartridge', 'release_button', 'label'] } },
  side:    { cam: [1500, 300, 260], target: [0, 290, 45], fov: 25, hide: ['drive_unit', 'pcb', 'supply_roll', 'takeup_roll', 'cores'] },
};
const V = VIEWS[view];
const cam = new THREE.PerspectiveCamera(V.fov, W / H, 1, 10000);
cam.position.set(...V.cam); cam.lookAt(...V.target);

const loader = new STLLoader();
const names = Object.keys(C).filter(n => !(V.hide || []).includes(n));
let pending = names.length;
for (const n of names) {
  loader.load(`../cad/out/${n}.stl`, geo => {
    geo.computeVertexNormals();
    const ghost = (V.ghost || []).includes(n);
    const mat = new THREE.MeshStandardMaterial({ ...C[n], transparent: ghost, opacity: ghost ? 0.18 : 1, depthWrite: !ghost });
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = !ghost; m.receiveShadow = true;
    if (V.move && V.move.parts.includes(n)) m.position.y = V.move.y;
    scene.add(m);
    if (ghost) {
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ color: 0x8FA3AA, transparent: true, opacity: 0.55 }));
      scene.add(edges);
    }
    if (--pending === 0) { renderer.render(scene, cam); window.__done = true; }
  });
}
</script></body></html>
